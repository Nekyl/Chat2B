<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<title>2B Chat — Erro</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap">
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }

		body {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #0A0A0A;
			font-family: 'Outfit', sans-serif;
			color: #e0d5c0;
			overflow: hidden;
			position: relative;
		}

		/* Grain overlay */
		body::before {
			content: '';
			position: fixed;
			inset: 0;
			opacity: 0.03;
			pointer-events: none;
			z-index: 2;
			background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
			background-size: 256px 256px;
		}

		/* Radial vignette */
		body::after {
			content: '';
			position: fixed;
			inset: 0;
			background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
			pointer-events: none;
			z-index: 1;
		}

		.container {
			text-align: center;
			position: relative;
			z-index: 3;
			padding: 2rem;
			animation: fadeUp 0.6s ease-out both;
		}

		@keyframes fadeUp {
			from { opacity: 0; transform: translateY(20px); }
			to { opacity: 1; transform: translateY(0); }
		}

		/* Logo */
		.logo {
			font-family: 'Cinzel', serif;
			font-size: clamp(2rem, 6vw, 3rem);
			font-weight: 700;
			letter-spacing: 4px;
			text-transform: uppercase;
			background: linear-gradient(135deg, #FFFFFF 0%, #D4A746 100%);
			-webkit-background-clip: text;
			background-clip: text;
			-webkit-text-fill-color: transparent;
			margin-bottom: 1.5rem;
		}

		/* Error code */
		.error-code {
			font-family: 'Cinzel', serif;
			font-size: clamp(6rem, 20vw, 12rem);
			font-weight: 800;
			line-height: 1;
			background: linear-gradient(135deg, rgba(212, 167, 70, 0.15) 0%, rgba(212, 167, 70, 0.04) 100%);
			-webkit-background-clip: text;
			background-clip: text;
			-webkit-text-fill-color: transparent;
			margin-bottom: 0.5rem;
			user-select: none;
		}

		.error-msg {
			font-size: clamp(1rem, 3vw, 1.25rem);
			font-weight: 300;
			color: #a09888;
			margin-bottom: 2.5rem;
			letter-spacing: 0.02em;
		}

		/* Button */
		.back-btn {
			display: inline-block;
			padding: 0.85rem 2.5rem;
			font-family: 'Outfit', sans-serif;
			font-size: 0.95rem;
			font-weight: 600;
			letter-spacing: 0.06em;
			text-transform: uppercase;
			color: #0A0A0A;
			background: linear-gradient(135deg, #FFFFFF 0%, #D4A746 100%);
			border: none;
			border-radius: 0.625rem;
			cursor: pointer;
			transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
			position: relative;
			overflow: hidden;
			box-shadow: 0 4px 20px rgba(212, 167, 70, 0.3);
		}

		.back-btn:hover {
			transform: translateY(-2px);
			box-shadow: 0 8px 32px rgba(212, 167, 70, 0.4);
		}

		/* Shimmer on button */
		.back-btn::after {
			content: '';
			position: absolute;
			top: 0;
			left: -100%;
			width: 100%;
			height: 100%;
			background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
			animation: shimmer 3s ease-in-out infinite;
		}

		@keyframes shimmer {
			0% { left: -100%; }
			50%, 100% { left: 100%; }
		}

		/* Ambient gold particles */
		.particle {
			position: fixed;
			width: 2px;
			height: 2px;
			background: rgba(212, 167, 70, 0.3);
			border-radius: 50%;
			pointer-events: none;
			z-index: 0;
			animation: float linear infinite;
		}

		@keyframes float {
			0% { transform: translateY(100vh) scale(0); opacity: 0; }
			10% { opacity: 1; }
			90% { opacity: 1; }
			100% { transform: translateY(-10vh) scale(1); opacity: 0; }
		}
	</style>
</head>
<body>

	<div class="container">
		<div class="logo">2B Chat</div>
		<div class="error-code">404</div>
		<p class="error-msg">Parece que essa p&aacute;gina n&atilde;o existe.</p>
		<button class="back-btn" onclick="history.go(-1);">Voltar</button>
	</div>

	<script>
		// Floating gold particles
		for (let i = 0; i < 20; i++) {
			const p = document.createElement('div');
			p.className = 'particle';
			p.style.left = Math.random() * 100 + '%';
			p.style.animationDuration = (4 + Math.random() * 6) + 's';
			p.style.animationDelay = (Math.random() * 5) + 's';
			p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
			document.body.appendChild(p);
		}
	</script>
</body>
</html>
